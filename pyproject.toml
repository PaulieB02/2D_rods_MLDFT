[project]
name = "hard-rods-neural-dft"
version = "1.0.0"
description = "Neural classical density functional theory for hard rods on a two-dimensional lattice"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Paul Bitzer" },
    { name = "Jens Weimar" },
    { name = "Martin Oettel" },
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.67.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "tensorboard>=2.21.0",
    "torch>=2.14.0",
]

[tool.uv]
# A collection of scripts run from the repository root (uv run reproduce_paper_figures.py),
# not an installable package.
package = false
